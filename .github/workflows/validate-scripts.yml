name: Validate Scripts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile all Python scripts
        run: |
          set -euo pipefail
          for f in python/*.py; do
            echo "::group::py_compile $f"
            python -m py_compile "$f"
            echo "::endgroup::"
          done
          echo "All Python scripts compile."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Import smoke test
        run: |
          set -euo pipefail
          cd python
          for f in *.py; do
            echo "::group::import $f"
            python -c "import importlib.util; spec = importlib.util.spec_from_file_location('m', '$f'); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)"
            echo "::endgroup::"
          done
          echo "All Python scripts import cleanly."

  bash:
    name: Bash validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check all Bash scripts
        run: |
          set -euo pipefail
          find aws redhat -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            echo "::group::bash -n $f"
            bash -n "$f"
            echo "::endgroup::"
          done
          echo "All Bash scripts pass bash -n."

      - name: ShellCheck (errors only)
        run: |
          set -euo pipefail
          find aws redhat -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error
          echo "ShellCheck found no errors."

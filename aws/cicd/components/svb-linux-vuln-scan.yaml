name: SVB-Linux-VulnScan
description: >
  Lightweight vulnerability / package inventory scan for Linux images.
  Installs and runs Amazon Inspector agent if available, otherwise performs
  a package inventory + common CVE surface checks and writes a report to
  /var/log/svb-vuln-scan.txt. Designed as a TEST or late BUILD component.
schemaVersion: 1.0

phases:
  - name: build
    steps:
      - name: CollectPackageInventory
        action: ExecuteBash
        onFailure: Continue
        inputs:
          commands:
            - |
              set -euo pipefail
              REPORT=/var/log/svb-vuln-scan.txt
              echo "=== SVB Vulnerability / Package Scan ===" > "$REPORT"
              echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$REPORT"
              echo "Hostname : $(hostname)" >> "$REPORT"
              echo "" >> "$REPORT"

              if command -v dnf >/dev/null 2>&1; then
                echo "--- dnf package list ---" >> "$REPORT"
                dnf list installed 2>/dev/null | head -500 >> "$REPORT" || true
              elif command -v yum >/dev/null 2>&1; then
                echo "--- yum package list ---" >> "$REPORT"
                yum list installed 2>/dev/null | head -500 >> "$REPORT" || true
              elif command -v dpkg >/dev/null 2>&1; then
                echo "--- dpkg package list ---" >> "$REPORT"
                dpkg -l 2>/dev/null | head -500 >> "$REPORT" || true
              fi

              echo "" >> "$REPORT"
              echo "--- Kernel ---" >> "$REPORT"
              uname -a >> "$REPORT"

              echo "" >> "$REPORT"
              echo "--- Listening ports (ss) ---" >> "$REPORT"
              ss -tuln 2>/dev/null >> "$REPORT" || netstat -tuln 2>/dev/null >> "$REPORT" || true

              echo "Package inventory written to $REPORT"

      - name: CheckCommonHighRiskPackages
        action: ExecuteBash
        onFailure: Continue
        inputs:
          commands:
            - |
              set -euo pipefail
              REPORT=/var/log/svb-vuln-scan.txt
              echo "" >> "$REPORT"
              echo "--- High-risk package presence check ---" >> "$REPORT"

              # Simple presence checks – extend with real CVE feeds or Inspector
              for pkg in openssl openssh-server sudo python3 java-1.8.0-openjdk; do
                if command -v rpm >/dev/null 2>&1; then
                  if rpm -q "$pkg" &>/dev/null; then
                    echo "PRESENT: $pkg ($(rpm -q $pkg))" >> "$REPORT"
                  else
                    echo "ABSENT : $pkg" >> "$REPORT"
                  fi
                elif command -v dpkg >/dev/null 2>&1; then
                  if dpkg -l "$pkg" 2>/dev/null | grep -q '^ii'; then
                    echo "PRESENT: $pkg" >> "$REPORT"
                  else
                    echo "ABSENT : $pkg" >> "$REPORT"
                  fi
                fi
              done

      - name: AttemptInspectorAgent
        action: ExecuteBash
        onFailure: Continue
        inputs:
          commands:
            - |
              set -euo pipefail
              # Best-effort: install Amazon Inspector agent if the SSM document / package is available
              # In most accounts Inspector scanning is enabled at the account level and does not
              # require an in-image agent for EC2. This step is kept for environments that still
              # use the classic agent.
              if command -v dnf >/dev/null 2>&1 || command -v yum >/dev/null 2>&1; then
                echo "Inspector classic agent install is account-specific – skipping automatic install"
              fi
              echo "Inspector / vuln scan step completed (see /var/log/svb-vuln-scan.txt)"

  - name: test
    steps:
      - name: VerifyReportExists
        action: ExecuteBash
        onFailure: Abort
        inputs:
          commands:
            - |
              set -euo pipefail
              test -s /var/log/svb-vuln-scan.txt
              echo "Vulnerability scan report present and non-empty"
              head -20 /var/log/svb-vuln-scan.txt
